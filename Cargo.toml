[workspace]
resolver = "3"
members = ["crates/clave", "crates/clave-bar", "crates/clave-types"]
# clave-bar is WASM-only; excluding it here means a plain `cargo build`/`cargo test`
# on the host never tries to compile it (spec §7).
default-members = ["crates/clave", "crates/clave-types"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/olliegilbey/clave"

[workspace.dependencies]
# Native binary deps
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# Shared serialization. preserve_order: Value maps keep insertion order, so
# the settings.json hooks merge rewrites the user's file WITHOUT
# alphabetizing their keys (never-clobber spirit — it may be dotfiles-tracked).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Advisory file locking for the state store (spec §5). fs4, NOT fs2 — fs2 is
# unmaintained; the spec names fs4 explicitly.
fs4 = "0.13"
# Binary discovery (spec §Discovery). which_global ONLY — plain which()
# respects cwd, and clave runs in arbitrary project dirs where a ./brew
# would satisfy the probe.
which = "8"
# Store tests write to throwaway dirs, never the real ~/.local/state/clave.
tempfile = "3"
# Zellij plugin — EXACT pin (#9, fugu nit): clave leans on observed 0.44.3
# semantics (permission-cache format, pane-resize refusals, serializer
# behavior — see the validation ledger). The zellij_pin_tripwire test fails
# loudly if this and the vendored kdl/zellij-utils lines ever drift apart;
# bump all of them together, deliberately, after re-validating live.
zellij-tile = "=0.44.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
