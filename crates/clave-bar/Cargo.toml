[package]
name = "clave-bar"
version.workspace = true
edition.workspace = true
license.workspace = true

# A Zellij plugin is a binary crate compiled to wasm32-wasip1 (src/main.rs +
# register_plugin!), matching zellij's official rust-plugin-example.
#
# The paired [lib]/[[bin]] split exists ONLY to host-test the pure model: the
# bin calls zellij-tile shims that resolve to the wasm host import
# `host_run_plugin_command`, which has NO symbol on the host target — so the
# bin links for wasm32-wasip1 alone (Task 6 finding; would bite the old spike
# bin identically). `test = false` keeps `cargo test -p clave-bar` from trying
# (and failing) to build a host test-harness for that un-host-linkable bin;
# `model` (zellij-tile-free) lives in the lib and tests cleanly on the host.

[lib]
name = "clave_bar"
path = "src/lib.rs"

[[bin]]
name = "clave-bar"
path = "src/main.rs"
test = false

# Excluded from cargo-dist: the bar ships EMBEDDED in the clave CLI (spec
# §Distribution) — dist would otherwise try to build this wasm-only bin
# natively for every release target, and it cannot link off wasm32-wasip1.
[package.metadata.dist]
dist = false

[dependencies]
zellij-tile = { workspace = true }
clave-types = { path = "../clave-types" }
serde_json = { workspace = true }

# Host-side property tests for the pure model (src/model.rs #[cfg(test)],
# issue #10 item 3). A dev-dependency compiles ONLY for `cargo test` on the
# host target — it never reaches the `cargo build --target wasm32-wasip1`
# artifact (dev-deps are excluded from normal/plugin builds), so proptest's
# non-wasm-friendly transitive deps (rusty-fork, tempfile, …) can't leak into
# the shipped plugin. Not added to the workspace deps: clave-bar is its sole
# consumer.
[dev-dependencies]
proptest = "1"
