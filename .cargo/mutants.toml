# cargo-mutants configuration. Run it with `just mutants` (the lines this
# branch changed vs `main`) or `just mutants-file <path>` for one module.
# NOT part of `just gates` — see docs/dev/TESTING.md, "Six shapes of
# green-and-worthless test", for what a surviving mutant means and which
# change classes owe a run.
#
# `.cargo/mutants.toml` is the path cargo-mutants reads by default (v27).

# LOAD-BEARING, and exactly the trap `just test` documents: the workspace's
# `default-members` excludes the wasm-only `clave-bar`, so the `cargo test` a
# mutant run defaults to would skip every model.rs and render.rs test — and
# every clave-bar mutant would then "survive" for a reason that has nothing to
# do with the code.
test_workspace = true

# Files where a surviving mutant carries no information.
exclude_globs = [
    # `[[bin]] test = false` (crates/clave-bar/Cargo.toml): nothing here is
    # reachable by ANY test, by construction, so 100% of its mutants survive.
    # The fix for that is the lib/bin split, not a mutation report.
    "crates/clave-bar/src/main.rs",
    # Examples are demonstration surfaces, not shipped behaviour. `bar-preview`
    # is driven by `render_rows`, which IS mutated.
    "crates/*/examples/**",
]

# Functions whose mutants cannot be distinguished by ANY host test, because
# what they read is process-global state the test binary does not have. Excluded
# by name rather than by file — the files themselves are full of testable logic.
exclude_re = [
    # Reads the controlling TTY's width. Under `cargo test` there is no TTY, so
    # the real function already returns `None` and both of its mutants (`None`,
    # `Some(0)` — which falls back to the same percent) are behaviourally
    # identical to it. The LOGIC is tested: `launch_layout_kdl_for` takes the
    # width as a parameter precisely so the derivation is reachable without a
    # terminal, and `the_launch_percent_is_derived_from_the_real_terminal_width`
    # pins it at two widths plus the no-TTY fallback. What is left here is a
    # one-line I/O shim, and the honest way to cover it is a live run
    # (LIVE-INTERACTION-CHECKLIST item 2), not a unit test.
    "launching_terminal_cols",
    # Orchestration that ends in `exec`: discovers zellij, reconciles a live or
    # dead session, composes and writes the launch layout, then replaces the
    # process. `-> Ok(())` survives because a test cannot reach past the exec to
    # observe that nothing happened. The pieces it ORCHESTRATES are each tested
    # directly — `launch_layout_kdl_for` for the layout, `session_is_live` /
    # `session_exists` for the reconciliation — which is where the decisions
    # actually live. Covering the seam needs tier 2 (#47), not a unit test.
    "launch_session",
    # `launch_session`'s backfill seam, same argument one layer down: it
    # resolves the AMBIENT store paths and claude dir, takes the store lock,
    # and prints — all process-global, none observable from a unit test
    # without racing env vars (see smart_zone's note on why those tests are
    # forbidden). Every decision it forwards to — `backfill_store`'s
    # seed-only walk, `derive_for_row`'s probing, the parser — is mutated
    # and killed directly. The seam itself is a live-run check: the
    # `clave: seeded frecency…` line on the next version refresh.
    "run_on_version_refresh",
    # Fire-and-forget by contract (#232): spawns `clave pr-sync <uuid>` fully
    # detached, with every stream nulled, and DROPS the child — its own doc
    # says the caller never learns whether the spawn succeeded, because the
    # hook must return before `gh` starts. There is no observable it could be
    # asserted against; a test that could see the child would be testing a
    # different function. What it forwards to is mutated and killed directly:
    # `pr_is_stale` decides whether to call it, `pr_sync_target` decides what
    # the child asks.
    "spawn_pr_sync",
    # `pr-sync`'s process entry point, same argument as `run_on_version_refresh`
    # above: resolves the AMBIENT store paths, takes the store lock, shells out
    # to `gh`, and pushes a snapshot — all process-global, none observable from
    # a unit test. Every decision inside it is reachable and mutated on its own
    # (`pr_sync_target` for the re-check, `resolve_pr`
    # for the parse and its degradations, `pr_is_stale` for the TTL, and
    # `apply_pr_answer` for the seq bump the push hangs on). The seam itself is
    # a live-run check: the PR cell filling within a TTL on a PR branch, and
    # QA drive phase 5b's quiet answer.
    "run_pr_sync",
    # Reads `ZELLIJ_SESSION_NAME` and forwards it. Under `cargo test` the
    # variable is whatever the developer's shell happens to hold, so `None`,
    # `Some("")` and `Some("xyzzy")` are all indistinguishable from the real
    # answer — and the honest fix, setting the variable in a test, is the
    # process-global race `smart_zone` forbids. The RULE it applies is split
    # out and mutated: `session_from_env` carries the empty-is-not-unset
    # asymmetry, and `every_rung_aims_the_push_at_the_session_it_names` pins
    # what the name is then used for.
    "own_session",
    # Fire-and-forget by contract (§5), the same argument as `spawn_pr_sync`
    # above: serialises the snapshot, spawns `zellij pipe` with every stream
    # nulled, and DROPS the child, because a global hook must never block
    # Claude on a pipe that can dawdle. Replacing the whole body with `()` is
    # indistinguishable from success to any host test — the observable is a
    # bar in another process repainting. Every decision it makes IS mutated:
    # `bounded_pipe_command` builds the argv (including which session it aims
    # at), `pipe_bound_ladder` picks the wrapper rung, `session_from_env`
    # carries the empty-is-not-unset rule. The seam itself is a live check —
    # a row's cells moving in the sandbox bar after a driven hook.
    "push_snapshot",
    # Writes the process-wide `PATH` for `dev launch`, then the caller execs
    # zellij. A test that could see the write must set `PATH` itself, and that
    # is the race `smart_zone` forbids. Measured on PR #282: with its body
    # replaced by `()`, every workspace test passes. The rule it applies is
    # split out and mutated: `path_with_shim_first` (shim first, once; an
    # unset PATH stays unset). The seam is a live check: drive phase 0b reads
    # the sandbox server's PATH and asserts the shim is the first entry.
    "shim_first_on_path",
]
